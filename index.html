<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b1020"
  >

  <title>MLBB Pro Manager</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <!-- =====================================================
       APP
       ===================================================== -->

  <div id="app">

    <!-- ===================================================
         COUNTRY SCREEN
         =================================================== -->

    <section
      id="countryScreen"
      class="screen"
    >

      <div class="container">

        <div class="hero">

          <div class="logo">
            MLBB
          </div>

          <h1>
            MLBB PRO MANAGER
          </h1>

          <p>
            Build your organization.
            Create your dynasty.
          </p>

        </div>

        <div class="card">

          <h2>
            Pilih Negara / Region
          </h2>

          <div
            id="countryList"
            class="country-list"
          ></div>

        </div>

      </div>

    </section>


    <!-- ===================================================
         LEAGUE SCREEN
         =================================================== -->

    <section
      id="leagueScreen"
      class="screen hidden"
    >

      <div class="container">

        <div class="topbar">

          <button
            onclick="showScreen('countryScreen')"
          >
            ← Kembali
          </button>

        </div>

        <div class="card">

          <h2>
            Pilih Liga
          </h2>

          <div
            id="leagueList"
            class="league-list"
          ></div>

        </div>

      </div>

    </section>


    <!-- ===================================================
         TEAM SCREEN
         =================================================== -->

    <section
      id="teamScreen"
      class="screen hidden"
    >

      <div class="container">

        <div class="topbar">

          <button
            onclick="showScreen('leagueScreen')"
          >
            ← Kembali
          </button>

        </div>

        <div class="card">

          <h2>
            Pilih Tim
          </h2>

          <div
            id="teamList"
            class="team-list"
          ></div>

        </div>

      </div>

    </section>


    <!-- ===================================================
         CAREER SETUP
         =================================================== -->

    <section
      id="careerScreen"
      class="screen hidden"
    >

      <div class="container">

        <div class="card">

          <h2>
            Mulai Karier
          </h2>

          <div
            id="careerInfo"
          ></div>

          <button
            class="primary-button"
            onclick="startCareer()"
          >
            MULAI KARIER
          </button>

        </div>

      </div>

    </section>


    <!-- ===================================================
         DASHBOARD
         =================================================== -->

    <section
      id="dashboardScreen"
      class="screen hidden"
    >

      <div class="container">

        <header class="dashboard-header">

          <div>

            <h1>
              MLBB PRO MANAGER
            </h1>

            <p id="dashboardDate">
              -
            </p>

          </div>

          <button
            onclick="saveGame()"
          >
            💾 Save
          </button>

        </header>


        <!-- TEAM INFO -->

        <div
          id="dashboardTeam"
          class="card"
        ></div>


        <!-- NEXT MATCH -->

        <div
          id="nextMatch"
          class="card"
        ></div>


        <!-- DASHBOARD MENU -->

        <div class="menu-grid">

          <button
            onclick="renderRoster()"
          >
            👥
            <span>Roster</span>
          </button>

          <button
            onclick="renderTransfer()"
          >
            💰
            <span>Transfer</span>
          </button>

          <button
            onclick="renderScouting()"
          >
            🔎
            <span>Scouting</span>
          </button>

          <button
            onclick="renderSchedule()"
          >
            📅
            <span>Schedule</span>
          </button>

          <button
            onclick="renderWorldRanking()"
          >
            🌎
            <span>World Ranking</span>
          </button>

          <button
            onclick="renderTournament()"
          >
            🏆
            <span>Tournament</span>
          </button>

          <button
            onclick="renderHistory()"
          >
            📜
            <span>History</span>
          </button>

          <button
            onclick="renderInbox()"
          >
            📬
            <span>Inbox</span>
          </button>

        </div>


        <!-- DASHBOARD CONTENT -->

        <div
          id="dashboardContent"
          class="card"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         ROSTER
         =================================================== -->

    <section
      id="rosterScreen"
      class="screen hidden"
    >

      <div class="container">

        <div class="topbar">

          <button
            onclick="showDashboard()"
          >
            ← Dashboard
          </button>

          <h2>
            Roster
          </h2>

        </div>

        <div
          id="rosterList"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         PLAYER PROFILE
         =================================================== -->

    <section
      id="playerScreen"
      class="screen hidden"
    >

      <div class="container">

        <div class="topbar">

          <button
            onclick="renderRoster()"
          >
            ← Roster
          </button>

        </div>

        <div
          id="playerProfile"
          class="card"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         TRANSFER
         =================================================== -->

    <section
      id="transferScreen"
      class="screen hidden"
    >

      <div class="container">

        <div class="topbar">

          <button
            onclick="showDashboard()"
          >
            ← Dashboard
          </button>

          <h2>
            Transfer Market
          </h2>

        </div>

        <div
          id="transferList"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         SCOUTING
         =================================================== -->

    <section
      id="scoutingScreen"
      class="screen hidden"
    >

      <div class="container">

        <div class="topbar">

          <button
            onclick="showDashboard()"
          >
            ← Dashboard
          </button>

          <h2>
            Scouting
          </h2>

        </div>

        <div
          id="scoutingList"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         SCHEDULE
         =================================================== -->

    <section
      id="scheduleScreen"
      class="screen hidden"
    >

      <div class="container">

        <div class="topbar">

          <button
            onclick="showDashboard()"
          >
            ← Dashboard
          </button>

          <h2>
            Schedule
          </h2>

        </div>

        <div
          id="scheduleList"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         WORLD RANKING
         =================================================== -->

    <section
      id="worldScreen"
      class="screen hidden"
    >

      <div class="container">

        <div class="topbar">

          <button
            onclick="showDashboard()"
          >
            ← Dashboard
          </button>

          <h2>
            World Ranking
          </h2>

        </div>

        <div
          id="worldRankingList"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         TOURNAMENT
         =================================================== -->

    <section
      id="tournamentScreen"
      class="screen hidden"
    >

      <div class="container">

        <div class="topbar">

          <button
            onclick="showDashboard()"
          >
            ← Dashboard
          </button>

          <h2>
            Tournament
          </h2>

        </div>

        <div
          id="tournamentList"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         HISTORY
         =================================================== -->

    <section
      id="historyScreen"
      class="screen hidden"
    >

      <div class="container">

        <div class="topbar">

          <button
            onclick="showDashboard()"
          >
            ← Dashboard
          </button>

          <h2>
            History
          </h2>

        </div>

        <div
          id="historyList"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         INBOX
         =================================================== -->

    <section
      id="inboxScreen"
      class="screen hidden"
    >

      <div class="container">

        <div class="topbar">

          <button
            onclick="showDashboard()"
          >
            ← Dashboard
          </button>

          <h2>
            Inbox
          </h2>

        </div>

        <div
          id="inboxList"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         MATCH
         =================================================== -->

    <section
      id="matchScreen"
      class="screen hidden"
    >

      <div class="container">

        <div
          id="matchContent"
          class="card"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         RESULT
         =================================================== -->

    <section
      id="resultScreen"
      class="screen hidden"
    >

      <div class="container">

        <div
          id="resultContent"
          class="card"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         MODAL
         =================================================== -->

    <div
      id="modal"
      class="modal hidden"
    >

      <div
        id="modalContent"
        class="modal-content"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       IMPORTANT SCRIPT ORDER
       ===================================================== -->

  <script src="./countries.js"></script>

  <script src="./mpl_data.js"></script>

  <script src="./app.js"></script>

</body>

        </html>
